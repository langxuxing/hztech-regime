[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-trend"
version = "0.2.0"
description = "BTC Regime classification, quant state machine, and AI trading advisor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
    "ccxt>=4.0",
    "smartmoneyconcepts>=0.0.26",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "flask>=3.0",
    "hmmlearn>=0.3.2",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
lstm = ["tensorflow>=2.15"]
ta = ["pandas-ta>=0.3.14b"]

[project.scripts]
regime-api = "ai_trade_advisor.api_server:main"
regime-snapshot-worker = "ai_trade_advisor.snapshot.worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_trade_advisor*", "algorithm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
