name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run core pytest suite
        run: |
          python -m pytest -q --tb=short \
            tests/test_trend_judgment.py \
            tests/test_trend_health_check.py \
            tests/test_api_radar_contract.py \
            tests/test_readiness_cache.py \
            tests/test_regime_feedback.py \
            tests/test_regime_core.py \
            tests/test_trend_soak.py \
            tests/test_week34_checklist.py
